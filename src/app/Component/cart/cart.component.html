<div class="cart-container">
  <div class="cart-header">
    <h2>My cart ({{ cartItems.length }})</h2>
    <div class="location">
      <mat-icon>location_on</mat-icon>
      <select>
        <option>Use current location</option>
        <!-- Add more options as needed -->
      </select>
    </div>
  </div>

  <div *ngFor="let item of cartItems" class="cart-item">
    <div class="book-info">
      <img [src]="item.book?.bookImage || 'assets/default-book.png'" alt="Book Cover" class="book-img" />
      <div>
        <h3>{{ item.book?.bookName }}</h3>
        <p>by {{ item.book?.author }}</p>
        <p>
          <span class="discount">Rs. {{ item.book?.discountPrice }}</span>
          <span class="original">Rs. {{ item.book?.price }}</span>
        </p>
      </div>
    </div>

    <div class="controls">
      <button (click)="decreaseQuantity(item)">-</button>
      <input type="number" [(ngModel)]="item.bookQuantity" />
      <button (click)="increaseQuantity(item)">+</button>
      <button (click)="removeItemFromCart(item)" class="remove-btn">Remove</button>
       <button class="place-order-btn">PLACE ORDER</button>
    </div>
  </div>

  <router-outlet></router-outlet>
